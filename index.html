<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expédition des Mers - Jeu TikTok</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: #1b263b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #4ea8de;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.5;
            color: #e0e1dd;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #38b000;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #2b9348;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Expédition des Mers</h1>
        <p>Bienvenue sur la page officielle de téléchargement de ton jeu TikTok interactif ! Clique sur le bouton ci-dessous pour récupérer ton fichier zip.</p>
        
        <!-- Ton lien Google Drive est maintenant intégré ici -->
        <a href="https://drive.google.com/file/d/1QGhfDdWaYhRo_nHeriVzOOPDXGQTiwlA/view?usp=drive_link" class="btn" target="_blank">Télécharger le jeu (.zip)</a>
    </div>
</body>
</html>
